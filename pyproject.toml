[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "herominer"
version = "1.0.0"
description = "Hero Wars desktop and browser automation application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi==2026.10.23",
    "Flask==3.0.3",
    "Flask-SocketIO==5.7.0",
    "Jinja2==3.1.6",
    "mitmproxy==12.2.2",
    "parse==1.20.2",
    "psutil==7.0.0",
    "py-linq==1.4.0",
    "pyperclip==1.9.0",
    "python-dotenv==1.1.0",
    "pytimeparse==1.1.8",
    "pywin32==310",
    "redis==5.2.1",
    "redis-logs==1.2.0",
    "schedule==1.2.2",
    "selenium==4.30.0",
    "selenium-wire-lw==3.0.2",
    "selenium-wire-undetected-chromedriver-lw==1.0.1",
    "undetected-chromedriver==3.5.5",
]

[project.scripts]
hm = "hm.cli:main"
hm-input = "hm.input:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hm = ["config/*"]
