name: Build and Upload Nuitka Executable Package

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/herominer:builder-py313-vctools
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/herominer:build-${{ github.run_id }}

jobs:
  build-and-package:
    name: Build EXE & Upload Package
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from release tag
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}"
          $cleanVersion = $version.TrimStart("v")
          $windowsVersion = ($cleanVersion -split '-')[0]
          if ($windowsVersion -notmatch '^\d+(\.\d+){0,3}$') {
            throw "Release tag must start with a numeric version: $version"
          }
          "clean_version=$cleanVersion" >> $env:GITHUB_ENV
          "windows_version=$windowsVersion" >> $env:GITHUB_ENV

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build release files (host-detected base)
        shell: powershell
        env:
          CERT_PASS: ${{ secrets.CERT_PASS }}
        run: |
          ./scripts/build-docker.ps1 `
            -BaseImage $env:BASE_IMAGE `
            -AppImage $env:APP_IMAGE `
            -AppVersion "${{ env.windows_version }}" `
            -TryPullBase -PushBase

      - name: Pack release files
        shell: pwsh
        run: |
          $releaseFiles = @(
            ".\release\cli.exe",
            ".\release\input.exe",
            ".\release\run.cmd"
          )
          foreach ($file in $releaseFiles) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing release file: $file"
            }
          }

          $zipName = "package_${{ env.clean_version }}.zip"
          New-Item -ItemType Directory -Path .\package | Out-Null
          Copy-Item -Path $releaseFiles -Destination .\package\
          Compress-Archive -Path .\package\* -DestinationPath $zipName
          "zip_name=$zipName" >> $env:GITHUB_ENV

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
