name: Build and Upload Nuitka Executable Package

on:
  release:
    types: [published]

env:
  BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/herominer:builder-py313
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/herominer:build-${{ github.run_id }}

jobs:
  build-and-package:
    name: Build EXE & Upload Package
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from release tag
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}"
          $cleanVersion = $version.TrimStart("v")
          $windowsVersion = ($cleanVersion -split '-')[0]
          if ($windowsVersion -notmatch '^\d+(\.\d+){0,3}$') {
            throw "Release tag must start with a numeric version: $version"
          }
          "clean_version=$cleanVersion" >> $env:GITHUB_ENV
          "windows_version=$windowsVersion" >> $env:GITHUB_ENV

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build images (host-detected base)
        shell: powershell
        env:
          CERT_PASS: ${{ secrets.CERT_PASS }}
        run: |
          ./scripts/build-docker.ps1 `
            -BaseImage $env:BASE_IMAGE `
            -AppImage $env:APP_IMAGE `
            -AppVersion "${{ env.windows_version }}" `
            -TryPullBase -PushBase

      - name: Pack release files from image
        run: |
          docker create --name extract-builder $env:APP_IMAGE
          docker cp extract-builder:/build/ ./build
          docker rm extract-builder
          
          $zipName = "package_${{ env.clean_version }}.zip"
          mkdir package
          
          # Real path after docker cp is ./build/
          copy .\build\release\cli.exe .\package\
          copy .\build\release\input.exe .\package\
          copy .\build\release\run.cmd .\package\
          
          Compress-Archive -Path .\package\* -DestinationPath $zipName
          echo "zip_name=$zipName" >> $env:GITHUB_ENV

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
